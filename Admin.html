<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دخول المعلم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background-color: #f0f4f8; text-align: center; padding: 50px; }
    input { padding: 10px; margin: 10px; width: 250px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; background-color: #1b5e20; color: white; border: none; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>🔐 دخول المعلم</h2>
  <input type="password" id="password" placeholder="أدخل كلمة المرور">
  <br>
  <button onclick="login()">دخول</button>

  <script>
    function login() {
      const pass = document.getElementById('password').value;
      if (pass === "admin123") {
        window.location.href = "teacher-panel.html";
      } else {
        alert("كلمة المرور غير صحيحة");
      }
    }
  </script>
</body>
</html>
