<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مديرية الامتحانات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- خط رسمي من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="title-bar">
    <h1>نتائج الامتحانات<br> لشهادة التعليم الثانوي بفروعها العلمي والادبي </h1>
  </div>

  <div class="form-card">
    <form id="searchForm">
      <div class="input-group">
        <label for="year">السنة</label>
        <select id="year">
          <option>2025</option>
          <option>2024</option>
        </select>
      </div>

      <div class="input-group">
        <label for="certificate">الشهادة</label>
        <select id="certificate">
          <option value="secondary">الثانوي</option>
          <option value="basic">الأساسي</option>
        </select>
      </div>

      <div class="input-group input-with-icon">
        <label for="number">رقم الاكتتاب</label>
        <input type="text" id="number" placeholder="أدخل رقم الاكتتاب" required>
        <span class="search-icon" onclick="searchResult()">🔍</span>
      </div>
    </form>
  </div>

  <script>
    function searchResult() {
      const inputNumber = document.getElementById('number').value;
      const data = JSON.parse(localStorage.getItem('studentData'));
      if (data && data.number === inputNumber) {
        window.location.href = "result.html";
      } else {
        alert("❌ لا توجد نتيجة لهذا الرقم.");
      }
    }
  </script>
</body>
</html>
