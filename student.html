<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نتائج الثانوية العامة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="title-bar">
    <h1>نتائج الثانوية العامة<br>بفرعيها العلمي والأدبي</h1>
  </div>

  <div class="form-card">
    <form id="searchForm">
      <div class="input-group">
        <label for="year">السنة</label>
        <select id="year">
          <option>2025</option>
          <option>2024</option>
        </select>
      </div>

      <div class="input-group">
        <label for="branch">الفرع</label>
        <select id="branch">
          <option value="scientific">علمي</option>
          <option value="literary">أدبي</option>
        </select>
      </div>

      <div class="input-group input-with-icon">
        <label for="number">رقم الاكتتاب</label>
        <input type="text" id="number" placeholder="ادخل رقم الاكتتاب" required>
        <span class="search-icon" onclick="searchResult()">🔍</span>
      </div>
    </form>
  </div>

  <script>
    function searchResult() {
      const inputNumber = document.getElementById('number').value;
      const data = JSON.parse(localStorage.getItem('studentData'));
      if (data && data.number === inputNumber) {
        window.location.href = "result.html";
      } else {
        alert("❌ لا توجد نتيجة لهذا الرقم.");
      }
    }
  </script>
</body>
</html>
