<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نتيجة الطالب</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="result-style.css">
</head>
<body>
  <header class="app-header">
    <h1>📘 نتيجة الطالب</h1>
    <h2>فرع <span id="branch-label">...</span> - محافظة الحسكة - عام 2025</h2>
  </header>

  <main class="container">
    <section class="result-grid">
      <div class="score-box max"><span id="max-score">--</span><small>العظمى ⏫</small></div>
      <div class="score-box status"><span class="status-text" id="status-text">...</span></div>
      <div class="score-box min"><span id="min-score">--</span><small>الدنيا ⏬</small></div>
      <div class="score-box total"><span id="total-score">--</span><small>المجموع</small></div>
    </section>

    <section class="card">
      <h3>📊 العلامات</h3>
      <table class="marks-table">
        <thead>
          <tr>
            <th>المادة</th>
            <th>الدرجة</th>
            <th>الدرجة العظمى</th>
            <th>الدرجة الدنيا</th>
          </tr>
        </thead>
        <tbody id="marks-body"></tbody>
      </table>
    </section>
  </main>

  <script>
    const student = JSON.parse(localStorage.getItem("activeStudent"));
    document.getElementById("branch-label").textContent = student.branch;

    let total = 0, maxTotal = 0, minTotal = 0;
    const tbody = document.getElementById("marks-body");

    for (const subject in student.marks) {
      const m = student.marks[subject];
      total += m.value;
      maxTotal += m.max;
      minTotal += m.min;

      const row = `<tr>
        <td>${subject}</td>
        <td>${m.value}</td>
        <td>${m.max}</td>
        <td>${m.min}</td>
      </tr>`;
      tbody.innerHTML += row;
    }

    document.getElementById("total-score").textContent = `${total}`;
    document.getElementById("max-score").textContent = `${maxTotal}`;
    document.getElementById("min-score").textContent = `${minTotal}`;

    const status = total >= minTotal ? "✅ ناجح" : "⛔ راسب";
    document.getElementById("status-text").textContent = status;
  </script>
</body>
</html>
